    <script>
        const firebaseConfig = { databaseURL: "https://firstsolar-e2ba3-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const userId = localStorage.getItem('userId');
        
        // Obtenir l'URL de base dynamique pour s'adapter au domaine GitHub Pages
        const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
        const platformLink = `${baseUrl}/register.html`;

        if (userId) {
            db.ref('users').child(userId).once('value').then((snapshot) => {
                const currentUserData = snapshot.val() || {};
                const myRefCode = currentUserData.refCode || '';
                const myPhone = currentUserData.phone || '';
                
                const inviteCodeToUse = myRefCode || userId;
                document.getElementById('invite-link').innerText = `${platformLink}?ref=${inviteCodeToUse}`;

                db.ref('users').on('value', (usersSnapshot) => {
                    const allUsers = usersSnapshot.val();
                    let lv1Count = 0, lv2Count = 0, lv3Count = 0;
                    let lv1Comm = 0, lv2Comm = 0, lv3Comm = 0;
                    let totalInvest = 0;

                    const isMyReferral = (u, targetId, targetRefCode, targetPhone) => {
                        const ref = u.referrer || u.referrerId || u.parrainId || '';
                        if (!ref) return false;
                        return ref === targetId || (targetRefCode && ref === targetRefCode) || (targetPhone && ref === targetPhone);
                    };

                    // Fonction pour calculer l'investissement total d'un utilisateur en vérifiant 'myProducts' ou les champs classiques
                    const getUserInvest = (u) => {
                        let inv = parseFloat(u.totalInvested || u.investedAmount || u.montantInvesti || u.montant || 0);
                        
                        // Si un dossier myProducts existe, on additionne les valeurs ou on cherche un prix/montant à l'intérieur
                        if (u.myProducts) {
                            for (let prodId in u.myProducts) {
                                const prod = u.myProducts[prodId];
                                // Si le produit contient un prix, un montant ou une valeur d'investissement
                                let prodPrice = parseFloat(prod.price || prod.montant || prod.amount || 0);
                                
                                // Si aucun prix n'est explicite dans le produit mais qu'on veut estimer selon le nom (ex: TRISTAR VIP 3)
                                if (prodPrice === 0 && prod.name) {
                                    // Tu peux adapter selon tes prix de VIP, ou si le produit stocke son prix. 
                                    // Si le produit ne stocke que 'daily', on peut aussi regarder si un champ 'price' ou 'invest' y figure.
                                }
                                inv += prodPrice;
                            }
                        }
                        
                        // Si tes scripts d'achat enregistrent l'investissement ailleurs, on s'assure de récupérer le montant global
                        return inv;
                    };

                    if (allUsers) {
                        for (let id1 in allUsers) {
                            const user1 = allUsers[id1];
                            
                            if (isMyReferral(user1, userId, myRefCode, myPhone)) {
                                lv1Count++;
                                
                                // Alternative directe : si l'achat met à jour un champ ou si on extrait le montant des produits
                                // Regardons aussi si le produit a un coût enregistré ou si l'on doit sommer les prix.
                                let invest1 = 0;
                                if (user1.myProducts) {
                                    for (let pId in user1.myProducts) {
                                        let p = user1.myProducts[pId];
                                        // Si tu stockes le prix d'achat dans le produit (ex: price, cost, amount)
                                        invest1 += parseFloat(p.price || p.amount || p.cost || 0);
                                    }
                                }
                                // S'il y a un champ global d'investissement en plus
                                invest1 += parseFloat(user1.totalInvested || user1.investedAmount || 0);

                                totalInvest += invest1;
                                lv1Comm += invest1 * 0.25; // 25%

                                const u1RefCode = user1.refCode || '';
                                const u1Phone = user1.phone || '';

                                for (let id2 in allUsers) {
                                    const user2 = allUsers[id2];
                                    if (isMyReferral(user2, id1, u1RefCode, u1Phone)) {
                                        lv2Count++;
                                        let invest2 = 0;
                                        if (user2.myProducts) {
                                            for (let pId2 in user2.myProducts) {
                                                let p2 = user2.myProducts[pId2];
                                                invest2 += parseFloat(p2.price || p2.amount || p2.cost || 0);
                                            }
                                        }
                                        invest2 += parseFloat(user2.totalInvested || user2.investedAmount || 0);

                                        totalInvest += invest2;
                                        lv2Comm += invest2 * 0.03; // 3%

                                        const u2RefCode = user2.refCode || '';
                                        const u2Phone = user2.phone || '';

                                        for (let id3 in allUsers) {
                                            const user3 = allUsers[id3];
                                            if (isMyReferral(user3, id2, u2RefCode, u2Phone)) {
                                                lv3Count++;
                                                let invest3 = 0;
                                                if (user3.myProducts) {
                                                    for (let pId3 in user3.myProducts) {
                                                        let p3 = user3.myProducts[pId3];
                                                        invest3 += parseFloat(p3.price || p3.amount || p3.cost || 0);
                                                    }
                                                }
                                                invest3 += parseFloat(user3.totalInvested || user3.investedAmount || 0);

                                                totalInvest += invest3;
                                                lv3Comm += invest3 * 0.01; // 1%
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }

                    // Mise à jour de l'interface
                    document.getElementById('team-size').innerText = (lv1Count + lv2Count + lv3Count) + " membre(s)";
                    document.getElementById('total-team-invest').innerText = totalInvest.toLocaleString('fr-FR') + " FC";
                    
                    document.getElementById('count-lv1').innerText = lv1Count;
                    document.getElementById('comm-lv1').innerText = lv1Comm.toLocaleString('fr-FR', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " FC";
                    
                    document.getElementById('count-lv2').innerText = lv2Count;
                    document.getElementById('comm-lv2').innerText = lv2Comm.toLocaleString('fr-FR', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " FC";
                    
                    document.getElementById('count-lv3').innerText = lv3Count;
                    document.getElementById('comm-lv3').innerText = lv3Comm.toLocaleString('fr-FR', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " FC";
                });
            });
        } else {
            window.location.href = "index.html";
        }

        function copyLink() {
            const link = document.getElementById('invite-link').innerText;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(link).then(() => {
                    alert("Lien d'invitation copié !");
                }).catch(() => fallbackCopy(link));
            } else {
                fallbackCopy(link);
            }
        }

        function fallbackCopy(text) {
            const tempInput = document.createElement("input");
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            alert("Lien d'invitation copié !");
        }
    </script>
